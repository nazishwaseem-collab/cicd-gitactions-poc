name: CI - Develop Features & Deploy to Dev

on:
  push:
    branches:
      - 'develop'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  JAVA_VERSION: '17'
  TARGET_ENV: 'DEV'
  ANYPOINT_ENV: 'Development'

jobs:
  ci_build_test_deploy_dev:
    name: CI Build, Test & Deploy to Development
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # Retrieve secrets from GitHub Secrets (Environment-specific)
      - name: Load Environment Secrets
        run: |
          echo "Loading DEV secrets from GitHub Secrets..."
          
          # Export to environment for Maven
          echo "ORG_ID=${{ secrets.ORG_ID }}" >> $GITHUB_ENV
          echo "CONNECTED_APP_CLIENT_ID=${{ secrets.CONNECTED_APP_CLIENT_ID }}" >> $GITHUB_ENV
          echo "CONNECTED_APP_CLIENT_SECRET=${{ secrets.CONNECTED_APP_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "ANYPOINT_PLATFORM_CLIENT_ID=${{ secrets.ANYPOINT_PLATFORM_CLIENT_ID }}" >> $GITHUB_ENV
          echo "ANYPOINT_PLATFORM_CLIENT_SECRET=${{ secrets.ANYPOINT_PLATFORM_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "DECRYPTION_KEY=${{ secrets.DECRYPTION_KEY }}" >> $GITHUB_ENV
          echo "NEXUS_USERNAME=${{ secrets.NEXUS_USERNAME }}" >> $GITHUB_ENV
          echo "NEXUS_PASSWORD=${{ secrets.NEXUS_PASSWORD }}" >> $GITHUB_ENV

      # Set unique SNAPSHOT version for development
      - name: Set CI version (SNAPSHOT with build number)
        run: |
          BASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          BASE_VERSION=$(echo "$BASE_VERSION" | sed 's/-SNAPSHOT//' | sed 's/-[0-9]*$//')
          NEW_VERSION="${BASE_VERSION}-${GITHUB_RUN_NUMBER}-SNAPSHOT"
          mvn -B versions:set -DnewVersion="${NEW_VERSION}" -DgenerateBackupPoms=false -DprocessDependencies=false
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "Using version: ${NEW_VERSION}"

      # Install Python and dependencies for generic encryption
      - name: Setup Python for Generic Property Encryption
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Required Python Packages
        run: |
          pip install pyyaml pycryptodome requests
          echo "Python packages installed"

      # Download Mule Secure Properties Tool
      - name: Download Mule Secure Properties Tool
        run: |
          echo "Downloading Mule Secure Properties Tool..."
          mkdir -p /tmp/mule-tools
          cd /tmp/mule-tools
          curl -sL https://docs.mulesoft.com/mule-runtime/latest/_attachments/secure-properties-tool.jar -o secure-properties-tool.jar
          if [ ! -f "secure-properties-tool.jar" ] || [ ! -s "secure-properties-tool.jar" ]; then
            echo "Failed to download secure-properties-tool.jar"
            exit 1
          fi
          echo "SECURE_TOOL_PATH=/tmp/mule-tools/secure-properties-tool.jar" >> $GITHUB_ENV
          echo "Mule Secure Properties Tool downloaded successfully"

      - name: Encrypt All Secure Properties
        run: |
          python3 << 'ENCRYPT_SCRIPT'
          import yaml
          import os
          import sys
          import subprocess
          from pathlib import Path

          def log_info(msg): 
              print(f"INFO: {msg}")
          
          def log_success(msg): 
              print(f"SUCCESS: {msg}")
          
          def log_error(msg): 
              print(f"ERROR: {msg}", file=sys.stderr)
          
          def log_warn(msg): 
              print(f"WARN: {msg}")

          def encrypt_with_jar(plaintext, key, tool_path):
              """Encrypt plaintext using Mule Secure Properties Tool"""
              try:
                  cmd = [
                      'java', '-cp', tool_path,
                      'com.mulesoft.tools.SecurePropertiesTool',
                      'string', 'encrypt', 'AES', 'CBC',
                      key, plaintext
                  ]
                  result = subprocess.run(cmd, capture_output=True, text=True)
                  if result.returncode != 0:
                      log_error(f"Encryption command failed: {result.stderr}")
                      return None
                  return result.stdout.strip()
              except Exception as e:
                  log_error(f"Encryption failed: {str(e)}")
                  return None

          def normalize_key_to_env_var(property_path):
              """
              Convert a nested YAML property path to environment variable format
              Examples:
                - bos.host -> BOS_HOST
                - database.primary.password -> DATABASE_PRIMARY_PASSWORD
              """
              return property_path.upper().replace('.', '_')

          def process_dict(node, path, secrets, key, tool_path, stats):
              """
              Recursively process YAML dictionary, encrypting ALL values
              Since this is config-secure-{ENV}.yaml, ALL properties are sensitive
              
              Args:
                  node: Current YAML node (dict)
                  path: Current property path (e.g., 'bos.host')
                  secrets: Dictionary of available environment variables
                  key: Encryption key
                  tool_path: Path to Mule secure properties tool
                  stats: Statistics dictionary to track encryption results
              """
              for k, v in node.items():
                  # Build the full property path
                  full_path = f"{path}.{k}" if path else k
                  
                  if isinstance(v, str):
                      # Convert to environment variable name
                      env_key = normalize_key_to_env_var(full_path)
                      
                      log_info(f"Processing property: {full_path}")
                      log_info(f"  Looking for environment variable: {env_key}")
                      
                      # Check if already encrypted
                      if v.startswith('![') and v.endswith(']'):
                          log_info(f"  Already encrypted, skipping: {full_path}")
                          stats["already_encrypted"].append(full_path)
                          continue
                      
                      # Check if we have a secret value for this property
                      if env_key in secrets and secrets[env_key]:
                          plaintext_value = secrets[env_key]
                          
                          # Encrypt the value
                          encrypted = encrypt_with_jar(plaintext_value, key, tool_path)
                          
                          if encrypted:
                              # Update the YAML with encrypted value
                              node[k] = f"![{encrypted}]"
                              stats["encrypted"].append(full_path)
                              log_success(f"  Encrypted: {full_path}")
                          else:
                              stats["failed"].append(full_path)
                              log_error(f"  Failed to encrypt: {full_path}")
                      else:
                          stats["skipped"].append((full_path, env_key))
                          log_warn(f"  No secret found for {env_key}")
                          log_warn(f"  Property will remain as placeholder: {v}")
                  
                  elif isinstance(v, dict):
                      # Recursively process nested dictionaries
                      process_dict(v, full_path, secrets, key, tool_path, stats)
                  
                  elif isinstance(v, list):
                      # Handle lists
                      for idx, item in enumerate(v):
                          if isinstance(item, dict):
                              process_dict(item, f"{full_path}[{idx}]", secrets, key, tool_path, stats)
                  
                  elif v is None or isinstance(v, (int, float, bool)):
                      # Non-string values are logged but not encrypted
                      log_info(f"Non-string value at {full_path}: {v} (type: {type(v).__name__})")
                      stats["non_string"].append(full_path)

          def main():
              # Get environment configuration
              env = os.getenv('TARGET_ENV', 'DEV').upper()
              secure_file = f"src/main/resources/properties/config-secure-{env}.yaml"
              
              log_info("="*60)
              log_info(f"Starting secure properties encryption for {env} environment")
              log_info(f"Target file: {secure_file}")
              log_info("="*60)
              
              # Validate secure file exists
              if not Path(secure_file).exists():
                  log_error(f"Secure config file not found: {secure_file}")
                  log_error(f"Expected location: {Path(secure_file).absolute()}")
                  sys.exit(1)
              
              # Get encryption key and tool path
              key = os.getenv('DECRYPTION_KEY')
              tool_path = os.getenv('SECURE_TOOL_PATH')
              
              if not key:
                  log_error("DECRYPTION_KEY environment variable is not set")
                  sys.exit(1)
              
              if not tool_path:
                  log_error("SECURE_TOOL_PATH environment variable is not set")
                  sys.exit(1)
              
              # Load ALL environment variables as potential secrets
              # GitHub Actions makes all secrets available as environment variables
              secrets = {k: v for k, v in os.environ.items() if k.isupper() and v}
              log_info(f"Loaded {len(secrets)} environment variables from GitHub Secrets")
              
              # Create backup
              backup = secure_file + ".backup"
              Path(secure_file).replace(backup)
              log_info(f"Created backup: {backup}")
              
              # Load YAML file
              try:
                  with open(backup, 'r') as f:
                      data = yaml.safe_load(f)
                  
                  if data is None:
                      log_error(f"YAML file is empty or invalid: {secure_file}")
                      sys.exit(1)
                      
              except Exception as e:
                  log_error(f"Failed to load YAML file: {str(e)}")
                  sys.exit(1)
              
              # Initialize statistics
              stats = {
                  "encrypted": [],
                  "skipped": [],
                  "failed": [],
                  "already_encrypted": [],
                  "non_string": []
              }
              
              # Process all properties
              log_info("\nProcessing all properties in secure config file...")
              log_info("NOTE: ALL properties in config-secure-{ENV}.yaml are treated as sensitive\n")
              
              process_dict(data, "", secrets, key, tool_path, stats)
              
              # Write updated YAML
              try:
                  with open(secure_file, 'w') as f:
                      yaml.dump(data, f, sort_keys=False, default_flow_style=False)
                  log_success(f"\nUpdated secure config file: {secure_file}")
              except Exception as e:
                  log_error(f"Failed to write YAML file: {str(e)}")
                  sys.exit(1)
              
              # Print comprehensive summary
              print("\n" + "="*60)
              print("ENCRYPTION SUMMARY")
              print("="*60)
              print(f"Environment: {env}")
              print(f"Secure file: {secure_file}")
              print(f"\nResults:")
              print(f"  Successfully Encrypted: {len(stats['encrypted'])}")
              print(f"  Already Encrypted: {len(stats['already_encrypted'])}")
              print(f"  Skipped (no secret): {len(stats['skipped'])}")
              print(f"  Failed: {len(stats['failed'])}")
              print(f"  Non-string values: {len(stats['non_string'])}")
              
              if stats['encrypted']:
                  print(f"\nEncrypted Properties:")
                  for prop in stats['encrypted']:
                      print(f"  - {prop}")
              
              if stats['already_encrypted']:
                  print(f"\nAlready Encrypted (skipped):")
                  for prop in stats['already_encrypted']:
                      print(f"  - {prop}")
              
              if stats['skipped']:
                  print(f"\nSkipped Properties (no matching GitHub Secret):")
                  for prop, env_var in stats['skipped']:
                      print(f"  - {prop}")
                      print(f"    Expected GitHub Secret: {env_var}")
                  print(f"\n  Action Required: Add missing secrets to GitHub:")
                  print(f"  Repository → Settings → Secrets and variables → Actions")
              
              if stats['failed']:
                  print(f"\nFailed Encryptions:")
                  for prop in stats['failed']:
                      print(f"  - {prop}")
                  log_error("\nSome properties failed to encrypt - BUILD FAILED")
                  sys.exit(1)
              
              print("="*60)
              
              if stats['skipped']:
                  log_warn(f"\nWARNING: {len(stats['skipped'])} properties were not encrypted due to missing secrets")
                  log_warn("The application may fail at runtime if these values are required")
              else:
                  log_success("\nAll properties encrypted successfully!")

          if __name__ == "__main__":
              main()
          ENCRYPT_SCRIPT
        env:
          TARGET_ENV: ${{ env.TARGET_ENV }}
          DECRYPTION_KEY: ${{ secrets.DECRYPTION_KEY }}
          SECURE_TOOL_PATH: ${{ env.SECURE_TOOL_PATH }}

      # Run MUnit Tests (80% coverage requirement)
      - name: Run MUnit Tests
        id: munit_test
        run: |
          echo "Running MUnit tests for environment ${TARGET_ENV}"
          mvn -B test -s .maven/settings.xml -P${TARGET_ENV} -Danypoint.organization=${ORG_ID} -Dclient.id="${CONNECTED_APP_CLIENT_ID}" -Dclient.secret="${CONNECTED_APP_CLIENT_SECRET}" -Dnexus.username="${NEXUS_USERNAME}" -Dnexus.password="${NEXUS_PASSWORD}" -Ddecryption.key="${DECRYPTION_KEY}" 2>&1 | tee munit-output.log
          
          COVERAGE=$(grep "Application Coverage:" munit-output.log | grep -oP '\d+\.\d+(?=%)' | tail -1 || echo "")
          echo "COVERAGE=${COVERAGE}" >> $GITHUB_ENV
          echo "Coverage: ${COVERAGE}%"

      - name: Check MUnit Coverage Threshold
        run: |
          THRESHOLD=$(mvn help:evaluate -Dexpression=munit.coverage.threshold -q -DforceStdout -P${TARGET_ENV})
          COVERAGE="${{ env.COVERAGE }}"
          
          if [ -z "$COVERAGE" ]; then
            echo "Error: Could not extract coverage percentage"
            exit 1
          fi
          
          echo "Current MUnit Coverage: ${COVERAGE}%"
          echo "Required Threshold: ${THRESHOLD}%"
          
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "MUnit coverage (${COVERAGE}%) is below the minimum threshold of ${THRESHOLD}%"
            exit 1
          else
            echo "MUnit coverage (${COVERAGE}%) meets the minimum threshold of ${THRESHOLD}%"
          fi

      - name: Upload MUnit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munit-reports-dev
          path: |
            target/site/munit/coverage/
            target/munit-reports/
            target/surefire-reports/
          if-no-files-found: warn

      # Build and Package with encrypted properties
      - name: Build with Maven
        run: |
          echo "Building application with encrypted secure properties..."
          mvn -B clean package -s .maven/settings.xml -P${TARGET_ENV} -DskipMunitTests -Danypoint.organization=${ORG_ID} -Dclient.id="${CONNECTED_APP_CLIENT_ID}" -Dclient.secret="${CONNECTED_APP_CLIENT_SECRET}" -Ddecryption.key="${DECRYPTION_KEY}" -Dnexus.username="${NEXUS_USERNAME}" -Dnexus.password="${NEXUS_PASSWORD}"
          
          echo "Application packaged successfully with encrypted properties"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mule-artifact-dev
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      # Upload to Exchange
      - name: Upload to Exchange
        run: |
          echo "Publishing SNAPSHOT version to Exchange..."
          echo "mvn -B deploy -s .maven/settings.xml -P${TARGET_ENV} -DskipMunitTests -Danypoint.organization=${ORG_ID} -Dclient.id="${CONNECTED_APP_CLIENT_ID}" -Dclient.secret="${CONNECTED_APP_CLIENT_SECRET}" -Ddecryption.key="${DECRYPTION_KEY}" -Dnexus.username="${NEXUS_USERNAME}" -Dnexus.password="${NEXUS_PASSWORD}""
          mvn -B deploy -s .maven/settings.xml -P${TARGET_ENV} -DskipMunitTests -Danypoint.organization=${ORG_ID} -Dclient.id="${CONNECTED_APP_CLIENT_ID}" -Dclient.secret="${CONNECTED_APP_CLIENT_SECRET}" -Ddecryption.key="${DECRYPTION_KEY}" -Dnexus.username="${NEXUS_USERNAME}" -Dnexus.password="${NEXUS_PASSWORD}"

      # API Management
      - name: Install Anypoint CLI
        run: |
          npm install -g anypoint-cli-v4
          sudo apt-get update && sudo apt-get install -y jq

      - name: Configure Anypoint CLI
        run: |
          anypoint-cli-v4 conf client_id "${CONNECTED_APP_CLIENT_ID}"
          anypoint-cli-v4 conf client_secret "${CONNECTED_APP_CLIENT_SECRET}"
          anypoint-cli-v4 conf organization "${ORG_ID}"

      - name: Manage API Instance
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout -P${TARGET_ENV})
          BASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -P${TARGET_ENV} | sed 's/-SNAPSHOT//' | sed 's/-[0-9]*$//')
          ENDPOINT_URI=$(mvn help:evaluate -Dexpression=api.manager.endpoint.uri -q -DforceStdout -P${TARGET_ENV})
          DEPLOYMENT_TYPE=$(mvn help:evaluate -Dexpression=api.manager.deployment.type -q -DforceStdout -P${TARGET_ENV})
          API_PATH=$(mvn help:evaluate -Dexpression=api.manager.path -q -DforceStdout -P${TARGET_ENV})
          API_SCHEME=$(mvn help:evaluate -Dexpression=api.manager.scheme -q -DforceStdout -P${TARGET_ENV})
          API_PORT=$(mvn help:evaluate -Dexpression=api.manager.port -q -DforceStdout -P${TARGET_ENV})
          echo "Managing API: $REPO_NAME version $BASE_VERSION"
          echo "Endpoint URI: $ENDPOINT_URI"
          API_INSTANCE_ID=$(anypoint-cli-v4 api-mgr:api:list --environment "${ANYPOINT_ENV}" --output json | jq -r --arg asset "$REPO_NAME" --arg ver "$BASE_VERSION" '.[] | select(.assetId==$asset and .assetVersion==$ver) | .id' || echo "")
          if [ -z "$API_INSTANCE_ID" ] || [ "$API_INSTANCE_ID" = "null" ]; then
            echo "Creating new API instance..."
            CREATE_OUTPUT=$(anypoint-cli-v4 api-mgr:api:manage "$REPO_NAME" "$BASE_VERSION" --environment "${ANYPOINT_ENV}" --deploymentType "$DEPLOYMENT_TYPE" --endpointUri "$ENDPOINT_URI" --path "$API_PATH" --scheme "$API_SCHEME" --port "$API_PORT" --muleVersion4OrAbove --output json 2>&1)
            echo "Create output: $CREATE_OUTPUT"
            API_INSTANCE_ID=$(echo "$CREATE_OUTPUT" | jq -r '.id // .apiInstanceId // empty' 2>/dev/null || echo "")
            if [ -z "$API_INSTANCE_ID" ]; then
              sleep 5
              API_INSTANCE_ID=$(anypoint-cli-v4 api-mgr:api:list --environment "${ANYPOINT_ENV}" --output json | jq -r --arg asset "$REPO_NAME" --arg ver "$BASE_VERSION" '.[] | select(.assetId==$asset and .assetVersion==$ver) | .id')
            fi
          else
            echo "API instance already exists with ID: $API_INSTANCE_ID"
          fi
          if [ -z "$API_INSTANCE_ID" ] || [ "$API_INSTANCE_ID" = "null" ]; then
            echo "ERROR: Failed to create or find API instance"
            echo "Please check if the asset '$REPO_NAME' version '$BASE_VERSION' exists in Exchange"
            exit 1
          fi
          echo "API_INSTANCE_ID=$API_INSTANCE_ID" >> $GITHUB_ENV
          echo "$API_INSTANCE_ID" > api_instance_id.txt

      - name: Upload API Instance ID
        uses: actions/upload-artifact@v4
        with:
          name: api-instance-id-dev
          path: api_instance_id.txt

      # Deploy to Development
      - name: Deploy to Development Environment
        run: |
          API_INSTANCE_ID=$(cat api_instance_id.txt)
          echo "Deploying to ${ANYPOINT_ENV} with API ID ${API_INSTANCE_ID}"
          echo "All deployment properties come from settings.xml profile: ${TARGET_ENV}"
          # Create properties file
          echo "env=${ANYPOINT_ENV}" > cloudhub-properties.txt
          echo "api.id=${API_INSTANCE_ID}" >> cloudhub-properties.txt
          echo "anypoint.platform.client_id=${ANYPOINT_PLATFORM_CLIENT_ID}" >> cloudhub-properties.txt
          echo "anypoint.platform.client_secret=${ANYPOINT_PLATFORM_CLIENT_SECRET}" >> cloudhub-properties.txt
          echo "Organization=${ORG_ID}">> cloudhub-properties.txt
          echo "Properties file content:"
          cat cloudhub-properties.txt
          mvn -B mule:deploy -s .maven/settings.xml -P${TARGET_ENV} -DmuleDeploy -DskipMunitTests -Danypoint.organization=${ORG_ID} -Danypoint.environment="${ANYPOINT_ENV}" -Dclient.id="${CONNECTED_APP_CLIENT_ID}" -Dclient.secret="${CONNECTED_APP_CLIENT_SECRET}" -Danypoint.platform.client.id="${ANYPOINT_PLATFORM_CLIENT_ID}" -Danypoint.platform.client.secret="${ANYPOINT_PLATFORM_CLIENT_SECRET}" -Ddecryption.key="${DECRYPTION_KEY}" -Dapi.id="${API_INSTANCE_ID}"

      - name: Deployment Summary
        if: success()
        run: |
          echo "Development deployment completed successfully!"
          echo "Version: ${{ env.NEW_VERSION }}"
          echo "Environment: ${ANYPOINT_ENV}"
          echo "Secure properties were encrypted and packaged in the JAR"